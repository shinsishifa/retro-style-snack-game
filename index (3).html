<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Snake & Apple Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      padding: 10px;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 420px;
      width: 100%;
    }
    .score-board {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background-color: #262636;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    canvas {
      background-color: #0f0f17;
      border: 3px solid #3b3b54;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      display: block;
    }
    /* Mobile Controls */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-gap: 8px;
      margin-top: 15px;
      width: 200px;
    }
    .btn {
      background: #3b3b54;
      color: #fff;
      border: none;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 3px 0 #242436;
    }
    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .btn-up { grid-column: 2; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }
    
    .instructions {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #8a8aab;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="score-board">
      <div>SCORE: <span id="score">0</span></div>
      <div>HIGH: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Touch controls for mobile devices -->
    <div class="controls">
      <button class="btn btn-up" onclick="changeDirection('UP')">▲</button>
      <button class="btn btn-left" onclick="changeDirection('LEFT')">◄</button>
      <button class="btn btn-down" onclick="changeDirection('DOWN')">▼</button>
      <button class="btn btn-right" onclick="changeDirection('RIGHT')">►</button>
    </div>

    <div class="instructions">Use ARROW KEYS / WASD or BUTTONS to move</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    const gridSize = 20; // 20x20 grid
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let apple = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_highScore') || 0;
    let gameInterval = null;
    let gameStarted = false;
    let gameOver = false;

    highScoreEl.innerText = highScore;

    function gameLoop() {
      if (gameOver) return;

      updateSnake();
      if (checkCollision()) {
        endGame();
        return;
      }
      drawGame();
    }

    function updateSnake() {
      if (!gameStarted) return;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      // Check if snake ate the apple
      if (head.x === apple.x && head.y === apple.y) {
        score += 10;
        scoreEl.innerText = score;
        if (score > highScore) {
          highScore = score;
          highScoreEl.innerText = highScore;
          localStorage.setItem('snake_highScore', highScore);
        }
        spawnApple();
      } else {
        snake.pop(); // Remove tail segment
      }
    }

    function checkCollision() {
      if (!gameStarted) return false;

      const head = snake[0];

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return true;
      }

      // Self collision
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return true;
        }
      }

      return false;
    }

    function spawnApple() {
      apple.x = Math.floor(Math.random() * tileCount);
      apple.y = Math.floor(Math.random() * tileCount);

      // Prevent apple from spawning on the snake
      snake.forEach(segment => {
        if (segment.x === apple.x && segment.y === apple.y) {
          spawnApple();
        }
      });
    }

    function drawGame() {
      // Clear canvas
      ctx.fillStyle = '#0f0f17';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines (subtle)
      ctx.strokeStyle = '#181824';
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Apple
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath();
      ctx.arc(
        apple.x * gridSize + gridSize / 2,
        apple.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Draw Snake
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#4de680' : '#2db85c'; // Head lighter green
        ctx.fillRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });

      // Overlay Screen for Start or Game Over
      if (!gameStarted && !gameOver) {
        drawOverlay('PRESS ARROWS / TAP TO START');
      } else if (gameOver) {
        drawOverlay('GAME OVER! Press Space to Restart');
      }
    }

    function drawOverlay(text) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.font = '16px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    function changeDirection(direction) {
      if (gameOver) {
        resetGame();
        return;
      }

      if (!gameStarted) gameStarted = true;

      if (direction === 'LEFT' && dx !== 1) { dx = -1; dy = 0; }
      if (direction === 'UP' && dy !== 1) { dx = 0; dy = -1; }
      if (direction === 'RIGHT' && dx !== -1) { dx = 1; dy = 0; }
      if (direction === 'DOWN' && dy !== -1) { dx = 0; dy = 1; }
    }

    function endGame() {
      gameOver = true;
      drawGame();
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 0;
      dy = 0;
      score = 0;
      scoreEl.innerText = score;
      gameStarted = false;
      gameOver = false;
      spawnApple();
      drawGame();
    }

    // Keyboard Listeners
    window.addEventListener('keydown', e => {
      switch (e.key) {
        case 'ArrowUp': case 'w': case 'W':
          changeDirection('UP'); break;
        case 'ArrowDown': case 's': case 'S':
          changeDirection('DOWN'); break;
        case 'ArrowLeft': case 'a': case 'A':
          changeDirection('LEFT'); break;
        case 'ArrowRight': case 'd': case 'D':
          changeDirection('RIGHT'); break;
        case ' ':
          if (gameOver) resetGame(); break;
      }
    });

    // Start Loop (Runs at 100ms ticks = 10 FPS)
    spawnApple();
    drawGame();
    setInterval(gameLoop, 100);
  </script>
</body>
</html>
